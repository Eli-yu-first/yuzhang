short_bio: >-
  <section style="text-align: justify;">
    <p>
      I am now a <strong>Ph.D.</strong> candidate at <strong><span style="color:#72246C">The Chinese University of Hong Kong</span></strong>, focusing on the research and development of physical AI systems. As a participant of <strong><span style="color:#660874">Tsinghua University</span></strong>’s National School of Excellence in Engineering, my research previously covered large‑scale models including LLMs and VLMs as well as unsupervised anomaly detection.
    </p>
  </section>
  <section style="text-align: justify;">
    <p>
    I previously worked as a <strong>GLM‑4 Pretraining Algorithm Research Assistant</strong> at <strong>Zhipu AI</strong>, where I improved the model’s mathematical reasoning capability via advanced techniques such as Chain‑of‑Thought (CoT). I have also participated in the development of state‑of‑the‑art algorithms including Qwen and DeepSeek. Beyond fundamental algorithm research, I lead a technical team for the National Key Research and Development Program (NKRDP), building forecasting models to support strategic decision‑making for China’s dual‑carbon objectives. During my tenure at the <strong> Shanghai Artificial Intelligence Laboratory </strong>, I achieved a 90‑% compression rate for the ViT visual model framework while preserving model accuracy. I also conducted research on AI‑powered anomaly‑detection algorithms at Pengcheng National Laboratory, and supported building‑system energy‑consumption optimization with digital‑twin technologies at <strong> Mercedes‑Benz Group </strong>.
    </p>
  </section>
  <section style="text-align: justify;">
    <p>
    Complementing my academic track record, I bring solid entrepreneurial experience. I co‑founded Nanjing Zhuyu Information Technology Co., Ltd., and took charge of multiple software‑development projects, accumulating hands‑on expertise in big‑data processing, algorithm optimization and industry‑market insights. My practice of translating academic research into real‑world deployable systems has shaped my goal of building practical, user‑centric AI solutions. I perform well under high‑pressure scenarios, excel at multi‑task management, and value cross‑team collaboration to deliver technological innovation. My personal interests include travelling, sports and reading.
    </p>
  </section>
  
